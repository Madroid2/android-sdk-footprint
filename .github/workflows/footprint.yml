name: SDK footprint
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: SDK integration profile
        type: choice
        options: [exif, playtime]
        default: exif
      baseline:
        description: Published baseline version for the selected SDK
        default: '1.3.6'
        required: true
      candidate:
        description: Published candidate version for the selected SDK
        default: '1.3.7'
        required: true
      budget:
        description: Allowed growth per host in bytes
        default: '102400'
        required: true

permissions:
  contents: read

jobs:
  footprint:
    name: SDK footprint budget
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: python3 -m unittest discover -s tests -v
      - uses: ./
        id: measure
        with:
          mode: apk
          profile: ${{ inputs.profile || 'exif' }}
          baseline: ${{ inputs.baseline || '1.3.6' }}
          candidate: ${{ inputs.candidate || '1.3.7' }}
          max-growth-bytes: ${{ inputs.budget || '102400' }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.measure.outputs.reports != '' }}
        with:
          name: sdk-footprint-reports
          path: ${{ steps.measure.outputs.reports }}/*.json
          if-no-files-found: ignore
