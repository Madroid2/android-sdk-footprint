name: SDK footprint
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Publisher APK growth or AAR archive growth
        type: choice
        options: [apk, aar]
        default: apk
      profile:
        description: SDK integration profile
        type: choice
        options: [exif, playtime]
        default: exif
      baseline:
        description: Published baseline version for the selected SDK
        default: '1.3.6'
        required: true
      candidate:
        description: Published candidate version for the selected SDK
        default: '1.3.7'
        required: true
      budget:
        description: Allowed growth per host in bytes
        default: '102400'
        required: true

permissions:
  contents: read

jobs:
  footprint:
    name: SDK footprint budget
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: inputs.mode != 'aar'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.mode != 'aar'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
        if: inputs.mode != 'aar'
      - run: python3 -m unittest discover -s tests -v
      - name: Fetch published AARs
        id: archives
        if: inputs.mode == 'aar'
        env:
          PROFILE: ${{ inputs.profile }}
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          case "$PROFILE" in
            exif) artifact=exifinterface; repo=https://dl.google.com/dl/android/maven2/androidx/exifinterface/exifinterface ;;
            playtime) artifact=adjoe-sdk-android; repo=https://releases.adjoe.io/maven/io/adjoe/adjoe-sdk-android ;;
            *) exit 2 ;;
          esac
          for side in baseline candidate; do
            if [[ "$side" == baseline ]]; then version="$BASELINE"; else version="$CANDIDATE"; fi
            [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 2
            path="$RUNNER_TEMP/$side.aar"
            curl --fail --silent --show-error --location --retry 2 "$repo/$version/$artifact-$version.aar" --output "$path"
            echo "$side=$path" >> "$GITHUB_OUTPUT"
          done
      - uses: ./
        id: measure
        with:
          mode: ${{ inputs.mode || 'apk' }}
          profile: ${{ inputs.profile || 'exif' }}
          baseline: ${{ steps.archives.outputs.baseline || inputs.baseline || '1.3.6' }}
          candidate: ${{ steps.archives.outputs.candidate || inputs.candidate || '1.3.7' }}
          max-growth-bytes: ${{ inputs.budget || '102400' }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.measure.outputs.reports != '' }}
        with:
          name: sdk-footprint-reports
          path: ${{ steps.measure.outputs.reports }}/*.json
          if-no-files-found: ignore
